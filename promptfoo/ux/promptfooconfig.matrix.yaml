# Mantia · UX matrix — multi-user × multi-penca × mixed-prediction
#
# Companion to promptfooconfig.yaml (canonical 1-user happy path) and
# promptfooconfig.review.yaml (LLM rubric on the same 4 pages). This
# config expands coverage to every (URL × identity) combination the
# fixture can produce, so a regression that only manifests on, say,
# "Bob viewing Alice's penca" gets caught.
#
# Fixture (set up by tests/ux/setup-matrix.php):
#   Alice (creator)  member of P_LIBE_MTX (libertadores) + P_MUN_MTX (mundial)
#   Bob              member of P_LIBE_MTX only
#   Carol            member of both, no manual predictions yet
#
# Predictions:
#   Alice: 1-1 on match A (libe), 2-0 on match B (libe)
#   Bob:   0-3 on match A (libe)
#   Carol: nothing manual (all auto-fill 0-0)
#
# Run:  bin/promptfoo-ux.sh matrix
# View: bin/promptfoo-ux.sh view

description: Mantia UX matrix — multi-user × multi-page

prompts:
  - 'GET {{url}}'

providers:
  - id: 'https'
    label: web fetch
    config:
      method: GET
      url: '{{url}}'
      headers:
        User-Agent: mantia-ux-detective-matrix/1.0
        Accept: text/html
      transformResponse: 'text'

defaultTest:
  vars:
    BASE: file://vars/base_url.txt
    ALICE_SHARE: file://vars/alice_share.txt
    BOB_SHARE: file://vars/bob_share.txt
    CAROL_SHARE: file://vars/carol_share.txt
    LIBE_VIEW: file://vars/libe_view.txt
    LIBE_NAME: file://vars/libe_name.txt
    LIBE_CODE: file://vars/libe_code.txt
    MUN_VIEW: file://vars/mun_view.txt
    MUN_NAME: file://vars/mun_name.txt
    MUN_CODE: file://vars/mun_code.txt

tests:
  # ═════════════════════════════════════════════════════════════════
  # LIBERTADORES PENCA (P_LIBE_MTX) — 3 viewers + anon
  # ═════════════════════════════════════════════════════════════════
  - description: 'libe·alice — creator+predictor sees her 1-1 + Invitar CTA'
    vars:
      url: '{{BASE}}/pronostico/g/{{LIBE_VIEW}}/?as={{ALICE_SHARE}}'
    assert:
      - { type: contains, value: 'Invitar amigos' }
      - { type: not-contains, value: 'Sumate · código' }
      - { type: contains, value: '{{LIBE_NAME}}' }
      - { type: contains, value: '✓ 1-1' }
      - { type: contains, value: '✓ 2-0' }
      - { type: not-contains, value: '✓ 0-3' }   # Bob's pick must not show

  - description: 'libe·bob — joiner sees his 0-3, NOT Alice''s picks'
    vars:
      url: '{{BASE}}/pronostico/g/{{LIBE_VIEW}}/?as={{BOB_SHARE}}'
    assert:
      - { type: contains, value: 'Invitar amigos' }
      - { type: contains, value: '✓ 0-3' }
      - { type: not-contains, value: '✓ 1-1' }
      - { type: not-contains, value: '✓ 2-0' }

  - description: 'libe·carol — member with NO manual predictions, no badges'
    vars:
      url: '{{BASE}}/pronostico/g/{{LIBE_VIEW}}/?as={{CAROL_SHARE}}'
    assert:
      - { type: contains, value: 'Invitar amigos' }
      - { type: not-contains, value: '✓ ' }     # no badges of any score

  - description: 'libe·anon — public landing: Sumate CTA, explainer, no leaks'
    vars:
      url: '{{BASE}}/pronostico/g/{{LIBE_VIEW}}/'
    assert:
      # Anon CTA was renamed from bare "Sumate · código X" to the more
      # action-explicit "Sumate por WhatsApp · código X" after the
      # expert-review surfaced that 'código' alone didn't convey what
      # the button actually does (2026-05-27).
      - { type: contains, value: 'Sumate por WhatsApp · código {{LIBE_CODE}}' }
      # And: anon must see a "what is Mantia" explainer before the CTA
      # so a cold-traffic stranger isn't asked to join something they
      # don't understand.
      - { type: contains, value: 'mantia-explainer-card' }
      - { type: contains, value: 'penca de fútbol por WhatsApp' }
      - { type: not-contains, value: 'Invitar amigos' }
      - { type: not-contains, value: '✓ 1-1' }
      - { type: not-contains, value: '✓ 0-3' }
      - { type: not-contains, value: '✓ 2-0' }

  # ═════════════════════════════════════════════════════════════════
  # MUNDIAL PENCA (P_MUN_MTX) — Alice + Carol members, Bob isn't
  # ═════════════════════════════════════════════════════════════════
  - description: 'mun·alice — member of mundial, NO predictions in this comp'
    vars:
      url: '{{BASE}}/pronostico/g/{{MUN_VIEW}}/?as={{ALICE_SHARE}}'
    assert:
      - { type: contains, value: 'Invitar amigos' }
      - { type: contains, value: '{{MUN_NAME}}' }
      - { type: not-contains, value: '✓ 1-1' }   # her libe predictions don't bleed
      - { type: not-contains, value: '✓ 0-3' }

  - description: 'mun·bob — NOT a member, sees Sumate (not Invitar)'
    vars:
      url: '{{BASE}}/pronostico/g/{{MUN_VIEW}}/?as={{BOB_SHARE}}'
    assert:
      # Bob has a share_token but isn't in this penca → page identifies
      # him and uses the warmer "también" handshake CTA instead of the
      # cold "Sumate · código X" anonymous CTA (expert-review 2026-05-27).
      - { type: contains, value: 'Sumate también a {{MUN_NAME}}' }
      - { type: contains, value: '{{MUN_CODE}}' }
      - { type: not-contains, value: 'Invitar amigos' }

  - description: 'mun·carol — member, no manual predictions'
    vars:
      url: '{{BASE}}/pronostico/g/{{MUN_VIEW}}/?as={{CAROL_SHARE}}'
    assert:
      - { type: contains, value: 'Invitar amigos' }
      - { type: not-contains, value: '✓ ' }

  # ═════════════════════════════════════════════════════════════════
  # COMPETITION PAGES — each user sees their own "mis pencas" set
  # ═════════════════════════════════════════════════════════════════
  - description: 'libe-comp·alice — sees her 1 libe penca + her badges + member CTA'
    vars:
      url: '{{BASE}}/pronostico/brasileirao-prueba/?as={{ALICE_SHARE}}'
    assert:
      - { type: contains, value: 'mis pencas de' }
      - { type: contains, value: '{{LIBE_NAME}}' }
      - { type: contains, value: 'tus pronósticos' }
      - { type: contains, value: '✓ 1-1' }
      - { type: contains, value: '✓ 2-0' }
      - { type: not-contains, value: '✓ 0-3' }
      # Member-aware bottom CTA: Alice should see "Seguí pronosticando en
      # <penca>" as the primary, not "Crear tu propia penca" (she's a
      # returning player mid-tournament, not a prospect). Expert-review
      # 2026-05-27 flagged the original CTA as misaligned for members.
      - { type: contains, value: 'Seguí pronosticando en {{LIBE_NAME}}' }
      # The "create another" pill stays available but as secondary copy.
      - { type: contains, value: 'O creá otra penca de' }
      # Member-hero treatment: "mis pencas" is hoisted ABOVE the global
      # hero with a stronger visual container (`mantia-member-hero`).
      - { type: contains, value: 'mantia-member-hero' }
      - { type: contains, value: 'Tu actividad en' }

  - description: 'libe-comp·bob — sees his 1 libe penca + his 0-3 badge + member CTA'
    vars:
      url: '{{BASE}}/pronostico/brasileirao-prueba/?as={{BOB_SHARE}}'
    assert:
      - { type: contains, value: 'mis pencas de' }
      - { type: contains, value: '{{LIBE_NAME}}' }
      - { type: contains, value: '✓ 0-3' }
      - { type: not-contains, value: '✓ 1-1' }
      - { type: not-contains, value: '✓ 2-0' }
      - { type: contains, value: 'Seguí pronosticando en {{LIBE_NAME}}' }

  - description: 'libe-comp·carol — member, no manual predictions, no badges'
    vars:
      url: '{{BASE}}/pronostico/brasileirao-prueba/?as={{CAROL_SHARE}}'
    assert:
      - { type: contains, value: 'mis pencas de' }
      - { type: contains, value: '{{LIBE_NAME}}' }
      - { type: not-contains, value: '✓ ' }

  - description: 'mun-comp·alice — sees her 1 mundial penca (separate from libe) + member CTA'
    vars:
      url: '{{BASE}}/pronostico/mundial-2026/?as={{ALICE_SHARE}}'
    assert:
      - { type: contains, value: 'mis pencas de' }
      - { type: contains, value: '{{MUN_NAME}}' }
      - { type: not-contains, value: '{{LIBE_NAME}}' }   # libe penca not on mundial page
      - { type: not-contains, value: '✓ 1-1' }            # libe predictions stay scoped to libe
      - { type: contains, value: 'Seguí pronosticando en {{MUN_NAME}}' }

  - description: 'mun-comp·bob — NOT a member of any mundial penca: no section'
    vars:
      url: '{{BASE}}/pronostico/mundial-2026/?as={{BOB_SHARE}}'
    assert:
      - { type: not-contains, value: 'mis pencas de' }
      # Anon CTA reads "Crear tu propia penca de X" (2026-05-27 copy
      # change after the free-review surfaced that bare "Crear penca de"
      # didn't disambiguate vs joining an existing penca).
      - { type: contains, value: 'Crear tu propia penca de' }
      - { type: not-contains, value: '✓ ' }

  - description: 'libe-comp·anon — no "mis pencas", no per-user badges'
    vars:
      url: '{{BASE}}/pronostico/brasileirao-prueba/'
    assert:
      - { type: not-contains, value: 'mis pencas de' }
      - { type: not-contains, value: 'tus pronósticos' }
      - { type: not-contains, value: '✓ ' }
      # Anon CTA reads "Crear tu propia penca de X" (2026-05-27 copy
      # change after the free-review surfaced that bare "Crear penca de"
      # didn't disambiguate vs joining an existing penca).
      - { type: contains, value: 'Crear tu propia penca de' }

  # ═════════════════════════════════════════════════════════════════
  # FRESHNESS — no match in the picker can have a past kickoff. The
  # 2026-05-27 incident: hardcoded fixture dates in the seed rotted
  # into the past, and the bot offered "Peñarol vs Indep. Santa Fe"
  # at "hoy 21:30" on a match the user knew had been played the day
  # before. Now every match row carries a data-kickoff-ts attribute,
  # and this assertion fails fast if any row points to the past.
  # ═════════════════════════════════════════════════════════════════
  - description: 'freshness · libe·alice match list has zero past kickoffs'
    vars:
      url: '{{BASE}}/pronostico/g/{{LIBE_VIEW}}/?as={{ALICE_SHARE}}'
    assert:
      - type: javascript
        value: |
          const html = output || '';
          const matches = [...html.matchAll(/data-kickoff-ts="(\d+)"/g)].map(m => parseInt(m[1], 10));
          if (matches.length === 0) {
            throw new Error('no match rows with data-kickoff-ts found — picker empty or attribute regressed');
          }
          const now = Math.floor(Date.now() / 1000);
          const past = matches.filter(ts => ts < now);
          if (past.length > 0) {
            throw new Error(`STALE picker on libe·alice: ${past.length}/${matches.length} kickoffs already happened`);
          }
          return true;

  - description: 'freshness · libe-comp anon match list has zero past kickoffs'
    vars:
      url: '{{BASE}}/pronostico/brasileirao-prueba/'
    assert:
      - type: javascript
        value: |
          const html = output || '';
          const matches = [...html.matchAll(/data-kickoff-ts="(\d+)"/g)].map(m => parseInt(m[1], 10));
          if (matches.length === 0) {
            throw new Error('no match rows with data-kickoff-ts on the anon comp page');
          }
          const now = Math.floor(Date.now() / 1000);
          const past = matches.filter(ts => ts < now);
          if (past.length > 0) {
            throw new Error(`STALE picker on comp page: ${past.length}/${matches.length} kickoffs already happened`);
          }
          return true;

  # ═════════════════════════════════════════════════════════════════
  # GLOBAL HYGIENE — no infrastructure leaks on any (URL × identity)
  # ═════════════════════════════════════════════════════════════════
  - description: 'hygiene · libe·alice has no PHP / token leaks'
    vars:
      url: '{{BASE}}/pronostico/g/{{LIBE_VIEW}}/?as={{ALICE_SHARE}}'
    assert:
      - { type: not-contains, value: 'wa_auth_t=' }
      - { type: not-contains, value: 'Fatal error' }
      - { type: not-contains, value: '<?php' }

  - description: 'hygiene · libe·anon has no PHP / token leaks'
    vars:
      url: '{{BASE}}/pronostico/g/{{LIBE_VIEW}}/'
    assert:
      - { type: not-contains, value: 'wa_auth_t=' }
      - { type: not-contains, value: 'Fatal error' }
      - { type: not-contains, value: '<?php' }
