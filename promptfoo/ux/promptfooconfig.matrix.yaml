# Mantia · UX matrix — multi-user × single-comp (mundial-2026)
#
# Companion to promptfooconfig.yaml (canonical 1-user happy path).
# Walks every (URL × identity) combination on top of a single penca
# (P_MUN_MTX in mundial-2026), so a regression that only manifests
# on "Bob viewing Alice's penca" gets caught without juggling a
# separate test competition.
#
# Fixture (set up by tests/ux/setup-matrix.php):
#   Alice  creator of P_MUN_MTX (mundial-2026)
#   Bob    joiner of P_MUN_MTX (one manual prediction)
#   Carol  joiner of P_MUN_MTX (no manual predictions yet)
#
# Run:  bin/promptfoo-ux.sh matrix
# View: bin/promptfoo-ux.sh view

description: Mantia UX matrix — multi-user × mundial-2026

prompts:
  - 'GET {{url}}'

providers:
  - id: 'https'
    label: web fetch
    config:
      method: GET
      url: '{{url}}'
      headers:
        User-Agent: mantia-ux-detective-matrix/1.0
        Accept: text/html
      transformResponse: 'text'

defaultTest:
  vars:
    BASE: file://vars/base_url.txt
    ALICE_SHARE: file://vars/alice_share.txt
    BOB_SHARE: file://vars/bob_share.txt
    CAROL_SHARE: file://vars/carol_share.txt
    MUN_VIEW: file://vars/mun_view.txt
    MUN_NAME: file://vars/mun_name.txt
    MUN_CODE: file://vars/mun_code.txt
    ALICE_ME: file://vars/alice_me.txt
    BOB_ME: file://vars/bob_me.txt
    CAROL_ME: file://vars/carol_me.txt

tests:
  # ═════════════════════════════════════════════════════════════════
  # PENCA PAGE (P_MUN_MTX) — 3 viewers + anon
  # ═════════════════════════════════════════════════════════════════
  - description: 'mun·alice — creator+predictor sees her 1-1 + Invitar CTA'
    vars:
      url: '{{BASE}}/pronostico/g/{{MUN_VIEW}}/?as={{ALICE_SHARE}}'
    assert:
      - { type: contains, value: 'Invitar amigos' }
      - { type: not-contains, value: 'Sumate · código' }
      - { type: contains, value: '{{MUN_NAME}}' }
      - { type: contains, value: '✓ 1-1' }
      - { type: contains, value: '✓ 2-0' }
      - { type: not-contains, value: '✓ 0-3' }   # Bob's pick must not show

  - description: 'mun·bob — joiner sees his 0-3, NOT Alice''s picks'
    vars:
      url: '{{BASE}}/pronostico/g/{{MUN_VIEW}}/?as={{BOB_SHARE}}'
    assert:
      - { type: contains, value: 'Invitar amigos' }
      - { type: contains, value: '✓ 0-3' }
      - { type: not-contains, value: '✓ 1-1' }
      - { type: not-contains, value: '✓ 2-0' }

  - description: 'mun·carol — member with NO manual predictions, no badges'
    vars:
      url: '{{BASE}}/pronostico/g/{{MUN_VIEW}}/?as={{CAROL_SHARE}}'
    assert:
      - { type: contains, value: 'Invitar amigos' }
      - { type: not-contains, value: '✓ ' }      # no badges of any score

  - description: 'mun·anon — public landing: Sumate CTA, explainer, no leaks'
    vars:
      url: '{{BASE}}/pronostico/g/{{MUN_VIEW}}/'
    assert:
      # Anon CTA reads "Ver invitación · código X" — points the user
      # at the /pronostico/sumate/<code>/ landing rather than firing
      # the WhatsApp deeplink directly (web-first creation flow).
      - { type: contains, value: 'Ver invitación · código {{MUN_CODE}}' }
      # Anon must see a "what is Mantia" explainer before the CTA so
      # cold-traffic strangers aren't asked to join blind.
      - { type: contains, value: 'mantia-explainer-card' }
      - { type: contains, value: 'penca de fútbol por WhatsApp' }
      - { type: not-contains, value: 'Invitar amigos' }
      - { type: not-contains, value: '✓ 1-1' }
      - { type: not-contains, value: '✓ 0-3' }
      - { type: not-contains, value: '✓ 2-0' }

  # ═════════════════════════════════════════════════════════════════
  # COMPETITION PAGE — each user sees their own "mis pencas" set
  # ═════════════════════════════════════════════════════════════════
  - description: 'mun-comp·alice — sees her 1 mundial penca + her badges + member CTA'
    vars:
      url: '{{BASE}}/pronostico/mundial-2026/?as={{ALICE_SHARE}}'
    assert:
      - { type: contains, value: 'mis pencas de' }
      - { type: contains, value: '{{MUN_NAME}}' }
      - { type: contains, value: 'tus pronósticos' }
      - { type: contains, value: '✓ 1-1' }
      - { type: contains, value: '✓ 2-0' }
      - { type: not-contains, value: '✓ 0-3' }
      # Member-aware bottom CTA: Alice should see "Seguí pronosticando
      # en <penca>" as the primary, not "Crear tu propia penca" (she's
      # a returning player mid-tournament, not a prospect).
      - { type: contains, value: 'Seguí pronosticando en {{MUN_NAME}}' }
      - { type: contains, value: 'O creá otra penca de' }
      - { type: contains, value: 'mantia-member-hero' }
      - { type: contains, value: 'Tu actividad en' }

  - description: 'mun-comp·bob — sees his 1 mundial penca + his 0-3 badge + member CTA'
    vars:
      url: '{{BASE}}/pronostico/mundial-2026/?as={{BOB_SHARE}}'
    assert:
      - { type: contains, value: 'mis pencas de' }
      - { type: contains, value: '{{MUN_NAME}}' }
      - { type: contains, value: '✓ 0-3' }
      - { type: not-contains, value: '✓ 1-1' }
      - { type: not-contains, value: '✓ 2-0' }
      - { type: contains, value: 'Seguí pronosticando en {{MUN_NAME}}' }

  - description: 'mun-comp·carol — member, no manual predictions, no badges'
    vars:
      url: '{{BASE}}/pronostico/mundial-2026/?as={{CAROL_SHARE}}'
    assert:
      - { type: contains, value: 'mis pencas de' }
      - { type: contains, value: '{{MUN_NAME}}' }
      - { type: not-contains, value: '✓ ' }

  - description: 'mun-comp·anon — no "mis pencas", no per-user badges'
    vars:
      url: '{{BASE}}/pronostico/mundial-2026/'
    assert:
      - { type: not-contains, value: 'mis pencas de' }
      - { type: not-contains, value: 'tus pronósticos' }
      - { type: not-contains, value: '✓ ' }
      - { type: contains, value: 'Crear tu propia penca de' }

  # ═════════════════════════════════════════════════════════════════
  # /me/ PAGE — ranking widget leads, stat-grid is conditional.
  # Added 2026-05-27 after Diego's "lo importante es el ranking"
  # feedback. The class string ".mantia-stat-grid" appears in the
  # stylesheet + the IntersectionObserver script regardless of
  # whether the SECTION renders — asserts look for the explicit
  # `<section class="…">` marker.
  # ═════════════════════════════════════════════════════════════════
  - description: 'me·alice — /me/ page leads with the ranking widget'
    vars:
      url: '{{BASE}}/pronostico/me/{{ALICE_ME}}/'
    assert:
      - { type: contains, value: '<section class="mantia-rank-card">' }
      - { type: contains, value: 'tu posición en' }
      - { type: contains, value: '{{MUN_NAME}}' }
      - { type: contains, value: 'mantia-rank-empty' }
      - { type: contains, value: 'tabla todavía vacía' }
      - { type: contains, value: 'Son 3 jugadores en la penca' }
      - type: javascript
        value: |
          const html  = output || '';
          const rankIdx = html.indexOf('<section class="mantia-rank-card">');
          const statIdx = html.indexOf('<section class="mantia-stat-grid">');
          if (rankIdx < 0) {
            throw new Error('<section class="mantia-rank-card"> missing from /me/ page');
          }
          if (statIdx >= 0 && statIdx < rankIdx) {
            throw new Error(`stat-grid appears before rank-card in the DOM (stat@${statIdx}, rank@${rankIdx}) — reordering regressed`);
          }
          return true;

  - description: 'me·bob — /me/ page shows ranking; stat-grid suppressed (no resolved matches)'
    vars:
      url: '{{BASE}}/pronostico/me/{{BOB_ME}}/'
    assert:
      - { type: contains, value: '<section class="mantia-rank-card">' }
      - { type: contains, value: 'tu posición en' }
      - { type: contains, value: 'tabla todavía vacía' }
      # $total_preds counts RESOLVED predictions (leaderboard rows),
      # not pending ones. Bob has 1 manual prediction but no Mundial
      # match has finished — stat grid stays suppressed. Diego's
      # cold-start "0 PUNTOS · 0 EXACTOS · 0 PRONÓSTICOS" is fixed.
      - { type: not-contains, value: '<section class="mantia-stat-grid">' }

  - description: 'me·carol — /me/ page shows ranking; stat-grid suppressed (no preds + no results)'
    vars:
      url: '{{BASE}}/pronostico/me/{{CAROL_ME}}/'
    assert:
      - { type: contains, value: '<section class="mantia-rank-card">' }
      - { type: contains, value: 'tabla todavía vacía' }
      - { type: not-contains, value: '<section class="mantia-stat-grid">' }

  # ═════════════════════════════════════════════════════════════════
  # FRESHNESS — no match in the picker can have a past kickoff.
  # The 2026-05-27 incident: hardcoded fixture dates rotted into the
  # past and the bot offered predictions on matches the user knew
  # had been played the day before. Every match row carries a
  # data-kickoff-ts attribute now; this assert fails fast if any
  # row points to the past.
  # ═════════════════════════════════════════════════════════════════
  - description: 'freshness · mun·alice match list has zero past kickoffs'
    vars:
      url: '{{BASE}}/pronostico/g/{{MUN_VIEW}}/?as={{ALICE_SHARE}}'
    assert:
      - type: javascript
        value: |
          const html = output || '';
          const matches = [...html.matchAll(/data-kickoff-ts="(\d+)"/g)].map(m => parseInt(m[1], 10));
          if (matches.length === 0) {
            throw new Error('no match rows with data-kickoff-ts found — picker empty or attribute regressed');
          }
          const now = Math.floor(Date.now() / 1000);
          const past = matches.filter(ts => ts < now);
          if (past.length > 0) {
            throw new Error(`STALE picker on mun·alice: ${past.length}/${matches.length} kickoffs already happened`);
          }
          return true;

  - description: 'freshness · mun-comp anon match list has zero past kickoffs'
    vars:
      url: '{{BASE}}/pronostico/mundial-2026/'
    assert:
      - type: javascript
        value: |
          const html = output || '';
          const matches = [...html.matchAll(/data-kickoff-ts="(\d+)"/g)].map(m => parseInt(m[1], 10));
          if (matches.length === 0) {
            throw new Error('no match rows with data-kickoff-ts on the anon comp page');
          }
          const now = Math.floor(Date.now() / 1000);
          const past = matches.filter(ts => ts < now);
          if (past.length > 0) {
            throw new Error(`STALE picker on comp page: ${past.length}/${matches.length} kickoffs already happened`);
          }
          return true;

  # ═════════════════════════════════════════════════════════════════
  # GLOBAL HYGIENE — no infrastructure leaks on any (URL × identity)
  # ═════════════════════════════════════════════════════════════════
  - description: 'hygiene · mun·alice has no PHP / token leaks'
    vars:
      url: '{{BASE}}/pronostico/g/{{MUN_VIEW}}/?as={{ALICE_SHARE}}'
    assert:
      - { type: not-contains, value: 'wa_auth_t=' }
      - { type: not-contains, value: 'Fatal error' }
      - { type: not-contains, value: '<?php' }

  - description: 'hygiene · mun·anon has no PHP / token leaks'
    vars:
      url: '{{BASE}}/pronostico/g/{{MUN_VIEW}}/'
    assert:
      - { type: not-contains, value: 'wa_auth_t=' }
      - { type: not-contains, value: 'Fatal error' }
      - { type: not-contains, value: '<?php' }
