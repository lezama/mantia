# Fast PHP syntax check + plugin-header smoke. Runs on every PR + push.
# No Composer install — just `php -l`. Should finish under a minute.
name: Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-lint:
    name: PHP syntax check
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
          coverage: none

      - name: Lint all PHP files
        run: |
          # Skips vendor/, node_modules/, .git/, and any dotfile dirs.
          # -print0 + xargs -0 -P handles file names with spaces and
          # parallelises 8 workers so the lint completes in ~10s even
          # on a repo with hundreds of PHP files.
          find . \
            -type d \( -name vendor -o -name node_modules -o -name '.git' -o -name 'drafts' \) -prune \
            -o -type f -name '*.php' -print0 \
          | xargs -0 -P 8 -n 16 php -l > /tmp/lint.log 2>&1
          # `php -l` exits 0 even when it printed parse errors, so we
          # have to grep for the failure line ourselves.
          if grep -E '(Parse error|Errors parsing)' /tmp/lint.log; then
            cat /tmp/lint.log
            exit 1
          fi
          tail -5 /tmp/lint.log

  plugin-header:
    name: Plugin header sanity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify plugin entry file
        run: |
          # mantia.php must declare the four headers we rely on.
          for field in 'Plugin Name' 'Version' 'Text Domain' 'Requires PHP'; do
            if ! grep -q "^ \* ${field}:" mantia.php; then
              echo "❌ Missing '${field}' header in mantia.php" >&2
              exit 1
            fi
          done
          echo "✅ All required plugin headers present"

      - name: Verify MANTIA_VERSION matches plugin header
        run: |
          # `Version:` in the header and the MANTIA_VERSION constant should
          # never drift. Compare them and fail loudly if they do.
          header=$(grep -E '^\s*\*\s*Version:' mantia.php | sed -E 's/.*Version:\s*([^[:space:]]+).*/\1/')
          constant=$(grep -E "define\(\s*'MANTIA_VERSION'" mantia.php | sed -E "s/.*'([^']+)'\s*\)\s*;.*/\1/" | tail -1)
          echo "Header:   ${header}"
          echo "Constant: ${constant}"
          if [ "$header" != "$constant" ]; then
            echo "❌ Version drift between plugin header and MANTIA_VERSION constant" >&2
            exit 1
          fi
